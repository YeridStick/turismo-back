name: Test, Build and Deploy to Lightsail

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: turismo-back-test
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and architecture validation
        run: ./gradlew test validateStructure --no-daemon

  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    environment: test
    needs: test

    env:
      # Preferir variables de entorno; el fallback permite migrar valores
      # que actualmente estén creados como secrets.
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || secrets.ECR_REPOSITORY }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}

    outputs:
      image: ${{ steps.image.outputs.uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          test -n "$AWS_REGION" || {
            echo "Missing variable: AWS_REGION"
            exit 1
          }

          test -n "$ECR_REPOSITORY" || {
            echo "Missing variable: ECR_REPOSITORY"
            exit 1
          }

          test -n "$AWS_ROLE_ARN" || {
            echo "Missing variable: AWS_ROLE_ARN"
            exit 1
          }

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: turismo-back-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --file deployment/Dockerfile \
            --tag "$IMAGE_URI" \
            .

          # ECR usa tags inmutables. Un reintento del mismo commit debe
          # reutilizar la imagen ya publicada en vez de intentar sobrescribirla.
          EXISTING_TAG=$(
            aws ecr batch-get-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'images[0].imageId.imageTag' \
              --output text 2>/dev/null || true
          )

          if [ "$EXISTING_TAG" = "$IMAGE_TAG" ]; then
            echo "ECR tag already exists; reusing $IMAGE_URI"
          else
            docker push "$IMAGE_URI"
          fi

          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    environment: test
    needs: build

    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}

    steps:
      - name: Validate Lightsail configuration
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST || secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER || secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
          TURISMO_ENV_FILE: ${{ secrets.TURISMO_ENV_FILE }}
        run: |
          test -n "$AWS_REGION" || {
            echo "Missing variable: AWS_REGION"
            exit 1
          }

          test -n "$AWS_ROLE_ARN" || {
            echo "Missing variable: AWS_ROLE_ARN"
            exit 1
          }

          test -n "$LIGHTSAIL_HOST" || {
            echo "Missing variable: LIGHTSAIL_HOST"
            exit 1
          }

          test -n "$LIGHTSAIL_USER" || {
            echo "Missing variable: LIGHTSAIL_USER"
            exit 1
          }

          test -n "$LIGHTSAIL_SSH_PRIVATE_KEY" || {
            echo "Missing secret: LIGHTSAIL_SSH_PRIVATE_KEY"
            exit 1
          }

          test -n "$LIGHTSAIL_SSH_KNOWN_HOSTS" || {
            echo "Missing secret: LIGHTSAIL_SSH_KNOWN_HOSTS"
            exit 1
          }

          test -n "$TURISMO_ENV_FILE" || {
            echo "Missing secret: TURISMO_ENV_FILE"
            exit 1
          }

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: turismo-deploy-${{ github.run_id }}

      - name: Prepare SSH and environment file
        env:
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
          TURISMO_ENV_FILE: ${{ secrets.TURISMO_ENV_FILE }}
        run: |
          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$LIGHTSAIL_SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/turismo"
          chmod 600 "$HOME/.ssh/turismo"

          printf '%s\n' "$LIGHTSAIL_SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          printf '%s\n' "$TURISMO_ENV_FILE" \
            > "$RUNNER_TEMP/turismo.env"
          chmod 600 "$RUNNER_TEMP/turismo.env"

          INVALID_LINES=$(
            grep -Ev \
              '^[[:space:]]*(#.*)?$|^[A-Za-z_][A-Za-z0-9_]*=.*$' \
              "$RUNNER_TEMP/turismo.env" || true
          )

          if [ -n "$INVALID_LINES" ]; then
            echo "TURISMO_ENV_FILE contains invalid lines."
            exit 1
          fi

          DUPLICATES=$(
            grep -E \
              '^[A-Za-z_][A-Za-z0-9_]*=' \
              "$RUNNER_TEMP/turismo.env" |
              cut -d= -f1 |
              sort |
              uniq -d
          )

          if [ -n "$DUPLICATES" ]; then
            echo "TURISMO_ENV_FILE contains duplicated keys:"
            echo "$DUPLICATES"
            exit 1
          fi

      - name: Authenticate Lightsail with ECR
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST || secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER || secrets.LIGHTSAIL_USER }}
        run: |
          ECR_REGISTRY=$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          ).dkr.ecr.${AWS_REGION}.amazonaws.com

          aws ecr get-login-password --region "$AWS_REGION" |
            ssh \
              -i "$HOME/.ssh/turismo" \
              "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
              "sudo docker login \
                --username AWS \
                --password-stdin \
                '$ECR_REGISTRY'"

      - name: Upload runtime configuration
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST || secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER || secrets.LIGHTSAIL_USER }}
        run: |
          scp \
            -i "$HOME/.ssh/turismo" \
            "$RUNNER_TEMP/turismo.env" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/tmp/turismo.env.new"

          ssh \
            -i "$HOME/.ssh/turismo" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "sudo install -d -m 700 -o root -g root /opt/turismo &&
             sudo install -m 600 -o root -g root \
               /tmp/turismo.env.new /opt/turismo/.env &&
             rm -f /tmp/turismo.env.new"

      - name: Deploy container with rollback
        env:
          IMAGE_URI: ${{ needs.build.outputs.image }}
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST || secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER || secrets.LIGHTSAIL_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/turismo" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "bash -s -- '$IMAGE_URI'" <<'REMOTE'
          set -Eeuo pipefail

          IMAGE_URI="$1"
          APP_NAME="turismo-back"
          PREVIOUS_NAME="${APP_NAME}-previous"

          rollback() {
            echo "Deployment failed. Restoring previous container."

            sudo docker rm -f "$APP_NAME" >/dev/null 2>&1 || true

            if sudo docker inspect \
              "$PREVIOUS_NAME" >/dev/null 2>&1; then
              sudo docker rename "$PREVIOUS_NAME" "$APP_NAME"
              sudo docker start "$APP_NAME"
            fi
          }

          trap rollback ERR

          sudo docker pull "$IMAGE_URI"

          sudo docker rm -f \
            "$PREVIOUS_NAME" >/dev/null 2>&1 || true

          if sudo docker inspect \
            "$APP_NAME" >/dev/null 2>&1; then
            sudo docker stop "$APP_NAME"
            sudo docker rename "$APP_NAME" "$PREVIOUS_NAME"
          fi

          sudo docker run -d \
            --name "$APP_NAME" \
            --restart unless-stopped \
            --env-file /opt/turismo/.env \
            --memory 1536m \
            --memory-swap 1536m \
            -p 80:7860 \
            "$IMAGE_URI"

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1/actuator/health |
              grep -q '"status":"UP"'; then

              trap - ERR

              sudo docker rm -f \
                "$PREVIOUS_NAME" >/dev/null 2>&1 || true

              sudo docker image prune -f

              echo "Deployment completed successfully."
              exit 0
            fi

            echo "Waiting for application health ($attempt/30)..."
            sleep 5
          done

          echo "Application did not become healthy."
          exit 1
          REMOTE
