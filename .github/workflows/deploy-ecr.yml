name: Test, Build and Deploy to Lightsail

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: turismo-back-test
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests and architecture validation
        run: ./gradlew test validateStructure --no-daemon

  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    environment: test
    needs: test

    env:
      # Preferir variables de entorno; el fallback permite migrar valores
      # que actualmente estén creados como secrets.
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || secrets.ECR_REPOSITORY }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          test -n "$AWS_REGION" || {
            echo "Missing variable: AWS_REGION"
            exit 1
          }

          test -n "$ECR_REPOSITORY" || {
            echo "Missing variable: ECR_REPOSITORY"
            exit 1
          }

          test -n "$AWS_ROLE_ARN" || {
            echo "Missing variable: AWS_ROLE_ARN"
            exit 1
          }

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: turismo-back-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --file deployment/Dockerfile \
            --tag "$IMAGE_URI" \
            .

          # ECR usa tags inmutables. Un reintento del mismo commit debe
          # reutilizar la imagen ya publicada en vez de intentar sobrescribirla.
          EXISTING_TAG=$(
            aws ecr batch-get-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'images[0].imageId.imageTag' \
              --output text 2>/dev/null || true
          )

          if [ "$EXISTING_TAG" = "$IMAGE_TAG" ]; then
            echo "ECR tag already exists; reusing $IMAGE_URI"
          else
            docker push "$IMAGE_URI"
          fi

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    environment: test
    needs: build

    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || secrets.ECR_REPOSITORY }}
      IMAGE_TAG: sha-${{ github.sha }}
      LIGHTSAIL_INSTANCE: Turismo-test-backend

    steps:
      - name: Validate Lightsail configuration
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST || secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER || secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
          TURISMO_ENV_FILE: ${{ secrets.TURISMO_ENV_FILE }}
        run: |
          test -n "$AWS_REGION" || {
            echo "Missing variable: AWS_REGION"
            exit 1
          }

          test -n "$AWS_ROLE_ARN" || {
            echo "Missing variable: AWS_ROLE_ARN"
            exit 1
          }

          test -n "$LIGHTSAIL_HOST" || {
            echo "Missing variable: LIGHTSAIL_HOST"
            exit 1
          }

          test -n "$LIGHTSAIL_USER" || {
            echo "Missing variable: LIGHTSAIL_USER"
            exit 1
          }

          test -n "$LIGHTSAIL_SSH_PRIVATE_KEY" || {
            echo "Missing secret: LIGHTSAIL_SSH_PRIVATE_KEY"
            exit 1
          }

          test -n "$LIGHTSAIL_SSH_KNOWN_HOSTS" || {
            echo "Missing secret: LIGHTSAIL_SSH_KNOWN_HOSTS"
            exit 1
          }

          test -n "$TURISMO_ENV_FILE" || {
            echo "Missing secret: TURISMO_ENV_FILE"
            exit 1
          }

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: turismo-deploy-${{ github.run_id }}

      - name: Prepare SSH and environment file
        env:
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
          TURISMO_ENV_FILE: ${{ secrets.TURISMO_ENV_FILE }}
        run: |
          install -m 700 -d "$HOME/.ssh"

          printf '%s\n' "$LIGHTSAIL_SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/turismo"

          # Normalizar la clave pegada en GitHub UI para evitar errores
          # libcrypto por CRLF o BOM.
          sed -i \
            -e '1s/^\xEF\xBB\xBF//' \
            -e 's/\r$//' \
            "$HOME/.ssh/turismo"
          chmod 600 "$HOME/.ssh/turismo"

          if ! ssh-keygen -y -f "$HOME/.ssh/turismo" >/dev/null 2>&1; then
            echo "LIGHTSAIL_SSH_PRIVATE_KEY no es una clave privada SSH válida."
            exit 1
          fi

          printf '%s\n' "$LIGHTSAIL_SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          printf '%s\n' "$TURISMO_ENV_FILE" \
            > "$RUNNER_TEMP/turismo.env"
          chmod 600 "$RUNNER_TEMP/turismo.env"

          # Normalizar archivos .env pegados desde Windows/GitHub UI:
          # elimina BOM, CRLF y espacios finales invisibles.
          sed -i \
            -e '1s/^\xEF\xBB\xBF//' \
            -e 's/\r$//' \
            -e 's/[[:blank:]]*$//' \
            "$RUNNER_TEMP/turismo.env"

          INVALID_LINE_NUMBERS=$(
            grep -nEv \
              '^[[:space:]]*(#.*)?$|^[A-Za-z_][A-Za-z0-9_]*=.*$' \
              "$RUNNER_TEMP/turismo.env" |
              cut -d: -f1 || true
          )

          if [ -n "$INVALID_LINE_NUMBERS" ]; then
            echo "TURISMO_ENV_FILE contains invalid lines: $INVALID_LINE_NUMBERS"
            exit 1
          fi

          DUPLICATES=$(
            grep -E \
              '^[A-Za-z_][A-Za-z0-9_]*=' \
              "$RUNNER_TEMP/turismo.env" |
              cut -d= -f1 |
              sort |
              uniq -d
          )

          if [ -n "$DUPLICATES" ]; then
            echo "TURISMO_ENV_FILE contains duplicated keys:"
            echo "$DUPLICATES"
            exit 1
          fi

          IDLE_TIME=$(
            grep -E '^CONN_POOL_IDLE_TIME=' "$RUNNER_TEMP/turismo.env" |
            cut -d= -f2- || true
          )

          if [ -n "$IDLE_TIME" ] && ! [[ "$IDLE_TIME" =~ ^[0-9]+$ ]]; then
            echo "CONN_POOL_IDLE_TIME must be an integer number of seconds."
            exit 1
          fi

      - name: Open temporary SSH access
        run: |
          RUNNER_IP=$(curl -4 -fsS https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"

          PORT_INFO=$(jq -cn \
            --arg cidr "$RUNNER_IP/32" \
            '{fromPort:22,toPort:22,protocol:"tcp",cidrs:[$cidr]}')

          aws lightsail open-instance-public-ports \
            --region "$AWS_REGION" \
            --instance-name "$LIGHTSAIL_INSTANCE" \
            --port-info "$PORT_INFO"

      - name: Authenticate Lightsail with ECR
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST || secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER || secrets.LIGHTSAIL_USER }}
        run: |
          ECR_REGISTRY=$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          ).dkr.ecr.${AWS_REGION}.amazonaws.com

          aws ecr get-login-password --region "$AWS_REGION" |
            ssh \
              -i "$HOME/.ssh/turismo" \
              "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
              "sudo docker login \
                --username AWS \
                --password-stdin \
                '$ECR_REGISTRY'"

      - name: Upload runtime configuration
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST || secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER || secrets.LIGHTSAIL_USER }}
        run: |
          scp \
            -i "$HOME/.ssh/turismo" \
            "$RUNNER_TEMP/turismo.env" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/tmp/turismo.env.new"

          ssh \
            -i "$HOME/.ssh/turismo" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "sudo install -d -m 700 -o root -g root /opt/turismo &&
             sudo install -m 600 -o root -g root \
               /tmp/turismo.env.new /opt/turismo/.env &&
             rm -f /tmp/turismo.env.new"

      - name: Deploy container with rollback
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST || secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER || secrets.LIGHTSAIL_USER }}
        run: |
          ECR_REGISTRY=$(
            aws sts get-caller-identity \
              --query Account \
              --output text
          ).dkr.ecr.${AWS_REGION}.amazonaws.com
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          test -n "$IMAGE_URI" || {
            echo "The build job did not produce an image URI."
            exit 1
          }

          case "$IMAGE_URI" in
            *[[:space:]]*)
              echo "The image URI contains whitespace."
              exit 1
              ;;
          esac

          IMAGE_URI_B64=$(printf '%s' "$IMAGE_URI" | base64 -w0)

          ssh \
            -i "$HOME/.ssh/turismo" \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "bash -s -- '$IMAGE_URI_B64' '$AWS_REGION'" <<'REMOTE'
          set -Eeuo pipefail

          IMAGE_URI=$(printf '%s' "$1" | base64 -d)
          AWS_REGION="$2"
          APP_NAME="turismo-back"
          PREVIOUS_NAME="${APP_NAME}-previous"

          diagnostics() {
            echo "--- Failed container state ---"
            sudo docker inspect "$APP_NAME" \
              --format 'status={{.State.Status}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' \
              2>&1 || true

            echo "--- Health response ---"
            curl \
              --silent \
              --show-error \
              --max-time 10 \
              --include \
              http://127.0.0.1/actuator/health \
              2>&1 || true

            echo "--- Failed container logs ---"
            sudo docker logs "$APP_NAME" --tail=250 2>&1 \
              | sed -E 's/(password|secret|token|api-key|private-key)([=: ]+)[^ ]+/\1\2[REDACTED]/Ig' \
              || true
          }

          rollback() {
            echo "Deployment failed. Restoring previous container."
            diagnostics

            sudo docker rm -f "$APP_NAME" >/dev/null 2>&1 || true

            if sudo docker inspect \
              "$PREVIOUS_NAME" >/dev/null 2>&1; then
              sudo docker rename "$PREVIOUS_NAME" "$APP_NAME"
              sudo docker start "$APP_NAME"
            fi
          }

          trap rollback ERR

          sudo docker pull "$IMAGE_URI"

          sudo docker rm -f \
            "$PREVIOUS_NAME" >/dev/null 2>&1 || true

          if sudo docker inspect \
            "$APP_NAME" >/dev/null 2>&1; then
            sudo docker stop "$APP_NAME"
            sudo docker rename "$APP_NAME" "$PREVIOUS_NAME"
          fi

          sudo docker run -d \
            --name "$APP_NAME" \
            --restart unless-stopped \
            --env-file /opt/turismo/.env \
            --memory 1536m \
            --memory-swap 1536m \
            -p 80:8080 \
            "$IMAGE_URI"

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1/actuator/health |
              grep -q '"status":"UP"'; then

              trap - ERR

              sudo docker rm -f \
                "$PREVIOUS_NAME" >/dev/null 2>&1 || true

              sudo docker image prune -f

              echo "Deployment completed successfully."
              exit 0
            fi

            echo "Waiting for application health ($attempt/30)..."
            sleep 5
          done

          echo "Application did not become healthy."
          exit 1
          REMOTE

      - name: Close temporary SSH access
        if: always()
        run: |
          if [ -z "${RUNNER_IP:-}" ]; then
            echo "No temporary SSH rule was created."
            exit 0
          fi

          PORT_INFO=$(jq -cn \
            --arg cidr "$RUNNER_IP/32" \
            '{fromPort:22,toPort:22,protocol:"tcp",cidrs:[$cidr]}')

          aws lightsail close-instance-public-ports \
            --region "$AWS_REGION" \
            --instance-name "$LIGHTSAIL_INSTANCE" \
            --port-info "$PORT_INFO"
